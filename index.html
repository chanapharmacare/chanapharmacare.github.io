<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chana Pharma &amp; Care</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Itim&display=swap&text=%E0%B8%A2%E0%B8%B4%E0%B8%99%E0%B8%94%E0%B8%B5%E0%B8%95%E0%B9%89%E0%B8%AD%E0%B8%A3%E0%B8%B1%E0%B8%9A%E0%B9%82%E0%B8%AB%E0%B8%A5%E0%B9%84%E0%B8%A1%E0%B9%88%E0%B8%AA%E0%B8%B3%E0%B9%80%E0%B9%87%E0%B8%88%E0%B8%87%E0%B8%9F%E0%B8%8A%E0%B8%81%E0%B8%84">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1F3C8F;background:linear-gradient(160deg,#FDF8F1 0%,#F6EADB 52%,#EDDBC4 100%)}
  .ld{display:flex;flex-direction:column;align-items:center;gap:14px}
  .stage{position:relative;width:120px;height:120px}
  .pill{position:absolute;left:50%;top:22px;width:84px;margin-left:-42px;animation:hop 1.1s cubic-bezier(.5,0,.5,1) infinite}
  .pill svg{display:block;width:100%;height:auto;animation:tilt 1.1s ease-in-out infinite}
  .shadow{position:absolute;left:50%;bottom:12px;width:56px;height:10px;margin-left:-28px;border-radius:50%;background:rgba(31,60,143,.14);animation:squish 1.1s cubic-bezier(.5,0,.5,1) infinite}
  .spark{position:absolute;width:10px;height:10px;border-radius:50%;background:#2FB5F5;opacity:0;animation:twinkle 1.6s ease-in-out infinite}
  .spark.s1{left:8px;top:18px}
  .spark.s2{right:6px;top:8px;width:8px;height:8px;background:#F58A3A;animation-delay:.5s}
  .spark.s3{right:14px;top:56px;width:6px;height:6px;background:#E8559A;animation-delay:1s}
  .msg{margin:0;font-family:"Itim",system-ui,sans-serif;font-size:19px;font-weight:400;letter-spacing:.01em;display:flex;align-items:center;gap:6px}
  .wtxt{display:inline-block;animation:floaty 2.2s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(0) scale(1)}30%{transform:translateY(-3px) rotate(-2deg) scale(1.02)}70%{transform:translateY(1px) rotate(2deg) scale(1)}}
  .smile{width:24px;height:24px;flex:none;transform-origin:50% 60%;animation:wink 1.1s ease-in-out infinite}
  @keyframes wink{0%,100%{transform:translateY(-1px) rotate(0) scale(1.03)}25%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-1px) rotate(0) scale(1.03)}75%{transform:translateY(0) rotate(6deg)}}
  .dots{display:flex;gap:6px}
  .dots i{width:7px;height:7px;border-radius:50%;background:#2FB5F5;animation:blink 1.2s ease-in-out infinite}
  .dots i:nth-child(2){animation-delay:.2s;background:#E8559A}
  .dots i:nth-child(3){animation-delay:.4s;background:#F58A3A}
  @keyframes hop{0%,100%{transform:translateY(18px)}50%{transform:translateY(-14px)}}
  @keyframes tilt{0%,100%{transform:rotate(-38deg)}50%{transform:rotate(-20deg)}}
  @keyframes squish{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.55);opacity:.45}}
  @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
  @keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-4px)}}
  @media (prefers-reduced-motion:reduce){.pill,.pill svg,.shadow,.spark,.dots i,.smile,.wtxt{animation:none}.pill svg{transform:rotate(-30deg)}.spark{opacity:1}}
</style>
</head>
<body>
<div class="ld" role="status" aria-live="polite">
  <div class="stage" aria-hidden="true">
    <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
    <div class="pill">
      <svg viewBox="0 0 120 52">
        <rect x="2" y="2" width="116" height="48" rx="24" fill="#fff"/>
        <path d="M60 7H31a19 19 0 0 0 0 38h29z" fill="#E8559A"/>
        <path d="M60 7h29a19 19 0 0 1 0 38H60z" fill="#F58A3A"/>
        <path d="M22 17h16" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/>
        <circle cx="44" cy="30" r="2.6" fill="#1F3C8F"/>
        <circle cx="76" cy="30" r="2.6" fill="#1F3C8F"/>
        <path d="M55 33q5 5 10 0" fill="none" stroke="#1F3C8F" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="38" cy="36" r="3.4" fill="#fff" fill-opacity=".45"/>
        <circle cx="82" cy="36" r="3.4" fill="#fff" fill-opacity=".45"/>
      </svg>
    </div>
    <div class="shadow"></div>
  </div>
  <p class="msg" id="msg"><span class="wtxt">ยินดีต้อนรับ</span><svg class="smile" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F772AE"/><stop offset="1" stop-color="#FFA24C"/></linearGradient></defs><circle cx="12" cy="12" r="11" fill="url(#sg)"/><path d="M7 10.2q1.5-1.8 3 0M14 10.2q1.5-1.8 3 0" fill="none" stroke="#1F3C8F" stroke-width="1.9" stroke-linecap="round"/><path d="M7.6 13.4q4.4 5.2 8.8 0z" fill="#1F3C8F"/><path d="M10.2 15.6q1.8 1 3.6 0" fill="none" stroke="#FF6FA8" stroke-width="1.3" stroke-linecap="round"/><circle cx="6.2" cy="13.4" r="1.4" fill="#fff" fill-opacity=".5"/><circle cx="17.8" cy="13.4" r="1.4" fill="#fff" fill-opacity=".5"/></svg></p>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
</div>
<script>
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbzzndxoJZ_xLnrggjkDYTCEkNeNO9BSR7xH2BnsXmgPHiQ3lIrtnL1JpWDAwVMG3DnhCQ/exec';
  var staff = /[?&]v=staff(&|$)/.test(location.search);
  fetch(API + '?page=1' + (staff ? '&v=staff' : ''))
    .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { document.getElementById('msg').textContent = 'โหลดไม่สำเร็จ ลองรีเฟรชอีกครั้ง'; });
})();
</script>
</body>
</html>
